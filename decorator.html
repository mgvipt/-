<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0f" />
<!-- iOS: запуск как приложение с домашнего экрана -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Декоратор" />
<title>Калькулятор декоратора</title>
<style>
  :root {
    --bg: #0b0b0f;
    --card: #16161d;
    --card-2: #1e1e27;
    --line: #2a2a35;
    --text: #f4f4f6;
    --muted: #9a9aa8;
    --accent: #ff5c8a;
    --accent-2: #ffb15c;
    --green: #34d399;
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    padding:
      calc(var(--safe-top) + 14px)
      16px
      calc(var(--safe-bottom) + 120px);
    max-width: 560px;
    margin: 0 auto;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 4px 0 2px;
    letter-spacing: -0.3px;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 700;
  }

  /* Позиция сметы */
  .item {
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .item-top {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  .item-name {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    padding: 6px 0;
  }
  .item-name::placeholder { color: var(--muted); }
  .item-name:focus { outline: none; }

  .item-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .mini-field { display: flex; flex-direction: column; gap: 4px; }
  .mini-field span { font-size: 11px; color: var(--muted); padding-left: 4px; }

  input[type="number"], input[type="text"] {
    width: 100%;
    background: #101017;
    border: 1px solid var(--line);
    border-radius: 11px;
    color: var(--text);
    padding: 11px 12px;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
  }
  input:focus { outline: none; border-color: var(--accent); }
  /* убираем стрелки у числовых полей */
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .item-sum {
    margin-top: 10px;
    text-align: right;
    font-size: 15px;
    color: var(--muted);
  }
  .item-sum b { color: var(--text); font-size: 17px; font-variant-numeric: tabular-nums; }

  .icon-btn {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #101017;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .icon-btn:active { background: #2a2a35; }

  .btn {
    display: block;
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--card-2);
    border: 1px dashed var(--line);
    margin-top: 2px;
  }
  .btn:active { transform: scale(0.99); }
  .btn-add {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(255, 92, 138, 0.08);
  }

  /* Параметры (наценка/работа/доставка) */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row label { font-size: 16px; }
  .row .ctl { display: flex; align-items: center; gap: 6px; }
  .row .ctl input { width: 110px; text-align: right; }
  .row .unit { color: var(--muted); font-size: 14px; width: 18px; }

  /* Итоги */
  .totals .line {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    color: var(--muted);
    font-size: 15px;
  }
  .totals .line b { color: var(--text); font-variant-numeric: tabular-nums; }
  .grand {
    margin-top: 10px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .grand span { font-size: 16px; font-weight: 700; }
  .grand b {
    font-size: 30px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }

  /* Нижняя панель действий */
  .bottombar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(11, 11, 15, 0.85);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(var(--safe-bottom) + 12px);
    display: flex;
    gap: 10px;
    max-width: 560px;
    margin: 0 auto;
  }
  .bottombar button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
  }
  .b-share { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; }
  .b-reset { background: var(--card-2); color: var(--muted); border: 1px solid var(--line); flex: 0 0 auto; padding: 14px 18px; }

  .hint { color: var(--muted); font-size: 12px; text-align: center; margin: 6px 0 0; }
</style>
</head>
<body>
  <h1>Калькулятор декоратора</h1>
  <p class="subtitle">Быстрый расчёт сметы оформления прямо с телефона</p>

  <section class="card">
    <h2>Позиции (материалы и услуги)</h2>
    <div id="items"></div>
    <button class="btn btn-add" id="add">+ Добавить позицию</button>
  </section>

  <section class="card">
    <h2>Параметры</h2>
    <div class="totals">
      <div class="row">
        <label>Наценка на материалы</label>
        <div class="ctl">
          <input type="number" id="markup" inputmode="decimal" min="0" step="1" value="0" />
          <span class="unit">%</span>
        </div>
      </div>
      <div class="row">
        <label>Работа / монтаж</label>
        <div class="ctl">
          <input type="number" id="labor" inputmode="decimal" min="0" step="100" value="0" />
          <span class="unit">₽</span>
        </div>
      </div>
      <div class="row">
        <label>Доставка</label>
        <div class="ctl">
          <input type="number" id="delivery" inputmode="decimal" min="0" step="100" value="0" />
          <span class="unit">₽</span>
        </div>
      </div>
      <div class="row">
        <label>Скидка клиенту</label>
        <div class="ctl">
          <input type="number" id="discount" inputmode="decimal" min="0" step="1" value="0" />
          <span class="unit">%</span>
        </div>
      </div>
    </div>
  </section>

  <section class="card totals">
    <h2>Итого</h2>
    <div class="line"><span>Материалы</span><b id="t-materials">0 ₽</b></div>
    <div class="line"><span>Наценка</span><b id="t-markup">0 ₽</b></div>
    <div class="line"><span>Работа</span><b id="t-labor">0 ₽</b></div>
    <div class="line"><span>Доставка</span><b id="t-delivery">0 ₽</b></div>
    <div class="line"><span>Скидка</span><b id="t-discount">0 ₽</b></div>
    <div class="grand"><span>К ОПЛАТЕ</span><b id="t-grand">0 ₽</b></div>
  </section>

  <p class="hint">Данные сохраняются на этом устройстве. Добавьте страницу на экран «Домой» — будет как приложение.</p>

  <div class="bottombar">
    <button class="b-share" id="share">Поделиться сметой</button>
    <button class="b-reset" id="reset">Сброс</button>
  </div>

<script>
(() => {
  "use strict";

  const KEY = "decorator.calc.v1";
  const $ = (s) => document.querySelector(s);

  const fmt = (n) =>
    new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 }).format(Math.round(n)) + " ₽";

  const num = (v) => {
    const n = parseFloat(String(v).replace(",", "."));
    return Number.isFinite(n) && n >= 0 ? n : 0;
  };

  let state = {
    items: [],
    markup: 0,
    labor: 0,
    delivery: 0,
    discount: 0,
  };

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) state = Object.assign(state, JSON.parse(raw));
    } catch (_) {}
    if (!Array.isArray(state.items) || state.items.length === 0) {
      state.items = [{ name: "", qty: 1, price: 0 }];
    }
  }

  const itemsRoot = $("#items");

  function renderItems() {
    itemsRoot.innerHTML = "";
    state.items.forEach((item, i) => {
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `
        <div class="item-top">
          <input class="item-name" type="text" placeholder="Например: пионовидные розы" value="${escapeAttr(item.name)}" data-i="${i}" data-f="name" />
          <button class="icon-btn" data-del="${i}" aria-label="Удалить">✕</button>
        </div>
        <div class="item-grid">
          <label class="mini-field">
            <span>Кол-во</span>
            <input type="number" inputmode="decimal" min="0" step="1" value="${item.qty}" data-i="${i}" data-f="qty" />
          </label>
          <label class="mini-field">
            <span>Цена за ед., ₽</span>
            <input type="number" inputmode="decimal" min="0" step="10" value="${item.price}" data-i="${i}" data-f="price" />
          </label>
        </div>
        <div class="item-sum">Сумма: <b>${fmt(num(item.qty) * num(item.price))}</b></div>
      `;
      itemsRoot.appendChild(el);
    });
  }

  function escapeAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function compute() {
    const materials = state.items.reduce((a, it) => a + num(it.qty) * num(it.price), 0);
    const markup = materials * (num(state.markup) / 100);
    const labor = num(state.labor);
    const delivery = num(state.delivery);
    const beforeDiscount = materials + markup + labor + delivery;
    const discount = beforeDiscount * (num(state.discount) / 100);
    const grand = beforeDiscount - discount;
    return { materials, markup, labor, delivery, discount, grand };
  }

  function renderTotals() {
    const t = compute();
    $("#t-materials").textContent = fmt(t.materials);
    $("#t-markup").textContent = fmt(t.markup);
    $("#t-labor").textContent = fmt(t.labor);
    $("#t-delivery").textContent = fmt(t.delivery);
    $("#t-discount").textContent = "−" + fmt(t.discount);
    $("#t-grand").textContent = fmt(t.grand);
  }

  function refreshSums() {
    document.querySelectorAll(".item").forEach((el, i) => {
      const it = state.items[i];
      el.querySelector(".item-sum b").textContent = fmt(num(it.qty) * num(it.price));
    });
    renderTotals();
  }

  // Делегирование ввода по позициям
  itemsRoot.addEventListener("input", (e) => {
    const t = e.target;
    const i = t.dataset.i, f = t.dataset.f;
    if (i === undefined) return;
    state.items[+i][f] = f === "name" ? t.value : num(t.value);
    refreshSums();
    save();
  });

  itemsRoot.addEventListener("click", (e) => {
    const del = e.target.dataset.del;
    if (del === undefined) return;
    state.items.splice(+del, 1);
    if (state.items.length === 0) state.items.push({ name: "", qty: 1, price: 0 });
    renderItems();
    renderTotals();
    save();
  });

  $("#add").addEventListener("click", () => {
    state.items.push({ name: "", qty: 1, price: 0 });
    renderItems();
    renderTotals();
    save();
    const inputs = itemsRoot.querySelectorAll(".item-name");
    inputs[inputs.length - 1].focus();
  });

  // Параметры
  ["markup", "labor", "delivery", "discount"].forEach((id) => {
    const el = $("#" + id);
    el.value = state[id];
    el.addEventListener("input", () => {
      state[id] = num(el.value);
      renderTotals();
      save();
    });
  });

  $("#reset").addEventListener("click", () => {
    if (!confirm("Очистить смету?")) return;
    state = { items: [{ name: "", qty: 1, price: 0 }], markup: 0, labor: 0, delivery: 0, discount: 0 };
    renderAll();
    save();
  });

  $("#share").addEventListener("click", async () => {
    const t = compute();
    const lines = ["Смета оформления", ""];
    state.items.forEach((it) => {
      if (!num(it.qty) && !num(it.price) && !it.name) return;
      lines.push(`• ${it.name || "Позиция"} — ${num(it.qty)} × ${fmt(num(it.price))} = ${fmt(num(it.qty) * num(it.price))}`);
    });
    lines.push("");
    lines.push(`Материалы: ${fmt(t.materials)}`);
    if (t.markup) lines.push(`Наценка: ${fmt(t.markup)}`);
    if (t.labor) lines.push(`Работа: ${fmt(t.labor)}`);
    if (t.delivery) lines.push(`Доставка: ${fmt(t.delivery)}`);
    if (t.discount) lines.push(`Скидка: −${fmt(t.discount)}`);
    lines.push(`ИТОГО К ОПЛАТЕ: ${fmt(t.grand)}`);
    const text = lines.join("\n");

    if (navigator.share) {
      try { await navigator.share({ title: "Смета оформления", text }); return; } catch (_) {}
    }
    try {
      await navigator.clipboard.writeText(text);
      alert("Смета скопирована в буфер обмена");
    } catch (_) {
      prompt("Скопируйте смету:", text);
    }
  });

  function renderAll() {
    renderItems();
    ["markup", "labor", "delivery", "discount"].forEach((id) => { $("#" + id).value = state[id]; });
    renderTotals();
  }

  load();
  renderAll();
})();
</script>
</body>
</html>
