# Боевой запуск GMIdeas CRM. Запускать из каталога crm-platform/.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  web:
    build: { context: ./backend }
    volumes:
      - /root/telephony-recordings:/app/media/recordings:ro
      - /root/crm-media/warehouse_photos:/app/warehouse_photos
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 6 -k gthread --threads 3 --timeout 300"
    environment: &crm-environment
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      META_PAGE_TOKEN: ${META_PAGE_TOKEN}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      TELEPHONY_TOKEN: ${TELEPHONY_TOKEN}
      TELEPHONY_WEBRTC_SECRET: ${TELEPHONY_WEBRTC_SECRET}
      TELEPHONY_WEBRTC_EXT: ${TELEPHONY_WEBRTC_EXT}
      TELEPHONY_WS: ${TELEPHONY_WS}
      META_IG_ID: ${META_IG_ID}
      META_PAGE_ID: ${META_PAGE_ID}
      META_IG_TOKEN: ${META_IG_TOKEN}
      META_IG_APP_SECRET: ${META_IG_APP_SECRET}
      META_APP_ID: ${META_APP_ID}
      CHATPLACE_API_KEY: ${CHATPLACE_API_KEY}
      CHATPLACE_MCP_URL: ${CHATPLACE_MCP_URL}
      LIQPAY_PUBLIC_KEY: ${LIQPAY_PUBLIC_KEY}
      LIQPAY_PRIVATE_KEY: ${LIQPAY_PRIVATE_KEY}
      WALLCOV_IBAN: ${WALLCOV_IBAN}
      WALLCOV_PAYEE: ${WALLCOV_PAYEE}
      WALLCOV_IPN: ${WALLCOV_IPN}
      CHECKBOX_API_BASE: ${CHECKBOX_API_BASE}
      CHECKBOX_PASSWORD: ${CHECKBOX_PASSWORD}
      CHECKBOX_LICENSE_KEY: ${CHECKBOX_LICENSE_KEY}
      SHOP_WEBHOOK_SECRET: ${SHOP_WEBHOOK_SECRET}
      SHOP_PUBLIC_URL: https://wallcov.com.ua
      SHOP_CATALOG_URL: https://wallcov.com.ua/api/crm/catalog-products
      CRM_PUBLIC_URL: https://crm.wallcovdec.com.ua
    depends_on: [db]
    restart: unless-stopped

  shop-sync:
    build: { context: ./backend }
    volumes:
      - /root/crm-media/warehouse_photos:/app/warehouse_photos
    command: python manage.py process_shop_catalog --watch --interval 30 --reconcile-minutes 15
    environment: *crm-environment
    depends_on: [db]
    restart: unless-stopped

  caddy:
    build: { context: ., dockerfile: deploy/Dockerfile.caddy }
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["127.0.0.1:${EDGE_PORT:-8137}:80"]
    depends_on: [web]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

volumes:
  pgdata:
