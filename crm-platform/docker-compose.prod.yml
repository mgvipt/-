# Боевой запуск GMIdeas CRM. Запускать из каталога crm-platform/:
#   cp .env.prod.example .env && nano .env   (укажи DOMAIN, пароли, SECRET_KEY)
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  web:
    build: { context: ./backend }
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 3 --timeout 60"
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on: [db]
    restart: unless-stopped

  caddy:
    build: { context: ., dockerfile: deploy/Dockerfile.caddy }
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
