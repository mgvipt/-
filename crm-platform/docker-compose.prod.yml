# Боевой запуск GMIdeas CRM. Запускать из каталога crm-platform/:
#   cp .env.prod.example .env && nano .env   (укажи DOMAIN, пароли, SECRET_KEY)
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  web:
    build: { context: ./backend }
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 3 --timeout 60"
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on: [db]
    restart: unless-stopped

  caddy:
    build: { context: ., dockerfile: deploy/Dockerfile.caddy }
    environment:
      DOMAIN: ${DOMAIN}
    # Слушаем только на localhost (порт настраивается через EDGE_PORT, по умолч. 8137).
    # Публичные 80/443 у системного nginx, который проксирует сюда поддомен CRM и держит TLS.
    ports: ["127.0.0.1:${EDGE_PORT:-8137}:80"]
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
