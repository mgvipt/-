# Виртуальный хост для CRM на системном nginx.
# Проксирует поддомен на контейнер Caddy (127.0.0.1:8090).
# Скопировать в /etc/nginx/sites-available/, включить симлинком в sites-enabled/,
# затем выпустить сертификат: certbot --nginx -d crm.wallcovdec.com.ua
server {
    listen 80;
    listen [::]:80;
    server_name crm.wallcovdec.com.ua;

    client_max_body_size 50m;   # под загрузку фото/файлов от клиентов

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
