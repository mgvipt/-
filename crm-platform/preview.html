<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GMIdeas CRM — превью</title>
<style>
/* ===== Самодостаточные стили (без внешних CDN/картинок) ===== */
:root{--brand:#2a6df4;--sidebar:#15324f;--sidebar2:#1d4063;--dt:#eef2f7;}
*{box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;}
html,body{margin:0;height:100%;overflow:hidden;color:#1e293b;background:#f1f5f9;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:8px;}
.app{display:flex;height:100vh;width:100vw;}
.hidden{display:none!important;}
.fade{animation:fade .25s ease;}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

/* sidebar */
.sidebar{width:212px;flex:0 0 212px;background:var(--sidebar);display:flex;flex-direction:column;color:#c5d4e6;}
.logo{height:52px;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.logo-badge{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;}
.logo b{color:#fff;font-size:15px;font-weight:600;}.logo span{color:#7dd3fc;}
.nav{flex:1;overflow-y:auto;padding:8px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;}
.nav-item .ic{width:18px;text-align:center;}
.nav-item:hover{background:var(--sidebar2);color:#fff;}
.nav-item.active{background:var(--sidebar2);color:#fff;border-left-color:#56b0ff;}
.me{padding:10px 14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:9px;font-size:12px;}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:52px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:5;}
.topbar h1{font-size:17px;font-weight:600;margin:0;}
.spacer{flex:1;}
.search{width:240px;height:32px;background:#f1f5f9;border:none;border-radius:7px;padding:0 12px;font-size:13px;outline:none;}
.btn{height:32px;border:none;border-radius:7px;padding:0 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-light{background:#f1f5f9;}.btn-light:hover{background:#e2e8f0;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-green{background:#10b981;color:#fff;}
.clock{height:32px;padding:0 12px;border-radius:7px;background:#10b981;color:#fff;font-size:13px;display:flex;align-items:center;}
.themebar{background:#fff;border-bottom:1px solid #e2e8f0;padding:8px 16px;display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap;}
.swatch{width:26px;height:26px;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer;}
.dot{width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;}
.muted{color:#94a3b8;}

.view{flex:1;overflow:hidden;background:var(--dt);background-size:cover;}

/* toolbar */
.toolbar{background:rgba(255,255,255,.8);border-bottom:1px solid #e2e8f0;padding:8px 14px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(4px);}
.toolbar select,.toolbar input{height:32px;border:1px solid #e2e8f0;border-radius:7px;padding:0 10px;font-size:13px;background:#fff;outline:none;}

/* kanban */
.kanban{height:100%;display:flex;flex-direction:column;}
.board{flex:1;overflow-x:auto;overflow-y:hidden;padding:12px;}
.cols{display:flex;gap:12px;height:100%;}
.col{width:262px;flex:0 0 262px;display:flex;flex-direction:column;}
.col-head{background:#fff;border-top:3px solid var(--c);border-radius:8px 8px 0 0;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;}
.col-head b{font-size:12.5px;font-weight:600;color:#334155;}
.col-body{background:rgba(248,250,252,.7);border-radius:0 0 8px 8px;padding:8px;flex:1;overflow-y:auto;}
.sum{text-align:center;font-size:12px;color:#64748b;margin-bottom:8px;font-weight:500;}
.card{background:#fff;border:1px solid #e4e9f0;border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(20,40,80,.05);}
.card:hover{box-shadow:0 4px 14px rgba(20,40,80,.13);border-color:#cdd9ea;}
.card .ttl{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px;}
.card .price{font-size:12px;color:#64748b;margin-bottom:6px;}
.owner{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#475569;margin-top:6px;}
.av{width:18px;height:18px;border-radius:50%;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.av-lg{width:64px;height:64px;font-size:22px;margin:0 auto 8px;}
.av-md{width:36px;height:36px;font-size:13px;}
.chip{display:inline-block;font-size:11px;line-height:1;padding:4px 7px;border-radius:5px;font-weight:600;color:#fff;}
.chip-unseen{background:#fff3cd;color:#9a7d0a;}
.cardfoot{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #f1f5f9;font-size:14px;color:#94a3b8;}
.cardfoot .t{margin-left:auto;font-size:10.5px;}

/* stage (deals) */
.stage{color:#fff;font-size:11.5px;font-weight:600;padding:6px 12px;margin-bottom:8px;white-space:nowrap;overflow:hidden;border-radius:4px;
  clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%);}

/* deal card */
.scroll{height:100%;overflow-y:auto;}
.dealhead{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 18px;}
.back{background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8;}
.stagebar{background:#fff;padding:8px 18px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid #e2e8f0;}
.tabs{background:#fff;padding:0 18px;display:flex;gap:18px;border-bottom:1px solid #e2e8f0;font-size:13px;color:#64748b;}
.tab{padding:10px 0;cursor:pointer;}.tab.active{color:var(--brand);border-bottom:2px solid var(--brand);}
.grid2{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;}
.panel{background:#fff;border:1px solid #e4e9f0;border-radius:8px;padding:16px;margin-bottom:12px;}
.label{font-size:11px;text-transform:uppercase;color:#94a3b8;margin-bottom:8px;letter-spacing:.3px;}
.row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
.player{background:#f1f5f9;border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;}
.play{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;border:none;cursor:pointer;}
.bar{flex:1;height:6px;background:#e2e8f0;border-radius:6px;}.bar i{display:block;height:100%;width:25%;background:var(--brand);border-radius:6px;}

/* inbox */
.inbox{height:100%;display:grid;grid-template-columns:300px 1fr 280px;}
.chanlist{background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;}
.chanhead{padding:10px;border-bottom:1px solid #e2e8f0;display:flex;gap:6px;flex-wrap:wrap;}
.chat-item{padding:10px 12px;border-bottom:1px solid #f1f5f9;display:flex;gap:9px;cursor:pointer;}
.chat-item:hover,.chat-item.active{background:#eff6ff;}
.chat-item .nm{font-size:13px;font-weight:500;}
.chat-item .pv{font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge-n{width:16px;height:16px;border-radius:50%;background:#3b82f6;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;align-self:center;}
.conv{display:flex;flex-direction:column;background:#f8fafc;}
.conv-head{height:52px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:8px;padding:0 16px;}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;}
.msg{max-width:70%;background:#fff;border-radius:10px 10px 10px 2px;padding:9px 11px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.msg.me{margin-left:auto;background:var(--brand);color:#fff;border-radius:10px 10px 2px 10px;}
.composer{background:#fff;border-top:1px solid #e2e8f0;padding:12px;display:flex;gap:8px;align-items:center;}
.composer input{flex:1;height:36px;background:#f1f5f9;border:none;border-radius:7px;padding:0 12px;font-size:13px;outline:none;}
.clientcard{background:#fff;border-left:1px solid #e2e8f0;padding:16px;overflow-y:auto;}

/* tables */
.pad{padding:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
thead{background:#f8fafc;color:#94a3b8;font-size:11px;text-transform:uppercase;}
th{text-align:left;padding:8px 16px;font-weight:600;}
td{padding:10px 16px;border-bottom:1px solid #f1f5f9;}
tbody tr:hover{background:#f8fafc;}
.tablewrap{background:#fff;border:1px solid #e4e9f0;border-radius:8px;overflow:hidden;}
.tabletitle{padding:10px 16px;border-bottom:1px solid #e2e8f0;font-weight:600;font-size:14px;}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.stat .big{font-size:24px;font-weight:700;}.stat .lbl{font-size:12px;color:#94a3b8;}
.note{background:#fff;border:1px solid #e4e9f0;border-radius:8px;padding:14px;margin-top:12px;font-size:12.5px;color:#64748b;}
.warn{background:#fffbeb;border-color:#fde68a;color:#92400e;}
/* toggle */
.toggle{width:34px;height:18px;border-radius:99px;background:#cbd5e1;position:relative;cursor:pointer;display:inline-block;transition:.2s;}
.toggle.on{background:var(--brand);}
.toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;}
.toggle.on::after{left:18px;}
.funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.funnel-row .nm{width:170px;font-size:12.5px;color:#475569;}
.funnel-bar{flex:1;height:24px;background:#f1f5f9;border-radius:5px;overflow:hidden;}
.funnel-bar i{display:flex;align-items:center;height:100%;color:#fff;font-size:11px;padding-left:8px;}
.chart{display:flex;align-items:flex-end;gap:5px;height:160px;}
.chart i{flex:1;border-radius:3px 3px 0 0;background:linear-gradient(var(--brand),#bcd4ff);}
.integ{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.integ .it{background:#fff;border:1px solid #e4e9f0;border-radius:8px;padding:12px;display:flex;align-items:center;gap:12px;}
.integ .ico{width:36px;height:36px;border-radius:9px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-badge">G</div><b>GMIdeas <span>CRM</span></b></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><span class="av" style="background:#7c3aed;width:28px;height:28px;font-size:11px">КО</span>
      <div><div style="color:#fff">Кирилл О.</div><div style="color:#7dd3fc">Администратор</div></div></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Лиды</h1>
      <div class="spacer"></div>
      <input class="search" placeholder="🔍  Поиск по CRM…"/>
      <button class="btn btn-light" onclick="document.getElementById('themebar').classList.toggle('hidden')">🎨 Тема</button>
      <div class="clock">15:10</div>
    </header>
    <div class="themebar hidden" id="themebar">
      <span class="muted">Фон:</span>
      <button class="swatch" style="background:#eef2f7" onclick="bg('#eef2f7')"></button>
      <button class="swatch" style="background:linear-gradient(135deg,#e0f2fe,#ede9fe)" onclick="bg('linear-gradient(135deg,#e0f2fe,#ede9fe)')"></button>
      <button class="swatch" style="background:linear-gradient(135deg,#1e3a8a,#0ea5e9)" onclick="bg('linear-gradient(135deg,#1e3a8a,#0ea5e9)')"></button>
      <button class="swatch" style="background:linear-gradient(135deg,#0ea5e9,#67e8f9)" onclick="bg('linear-gradient(135deg,#0ea5e9,#67e8f9)')"></button>
      <span class="muted" style="margin-left:10px">Акцент:</span>
      <button class="dot" style="background:#2a6df4" onclick="ac('#2a6df4')"></button>
      <button class="dot" style="background:#7c3aed" onclick="ac('#7c3aed')"></button>
      <button class="dot" style="background:#0ea5e9" onclick="ac('#0ea5e9')"></button>
      <button class="dot" style="background:#059669" onclick="ac('#059669')"></button>
      <span class="muted" style="margin-left:8px;font-style:italic">(каждый сотрудник настраивает под себя)</span>
    </div>
    <main class="view" id="view"></main>
  </div>
</div>

<script>
function bg(v){var el=document.getElementById('view');el.style.background=v;el.style.backgroundSize='cover';}
function ac(c){document.documentElement.style.setProperty('--brand',c);}
function avc(s){var c=['#2563eb','#7c3aed','#db2777','#ea580c','#059669','#0891b2','#4f46e5'];var n=0;for(var i=0;i<s.length;i++)n+=s.charCodeAt(i);return c[n%c.length];}
function initials(s){var p=s.trim().split(' ');return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'');}
function av(name,cls){return '<span class="av '+(cls||'')+'" style="background:'+avc(name)+'">'+initials(name).toUpperCase()+'</span>';}

var SRC={tg:['Telegram','#27a7e7'],vb:['Viber','#7d4fc4'],ig:['Instagram','#e1306c'],fb:['Facebook','#1877f2'],wa:['WhatsApp','#25d366'],call:['Звонок','#16a34a'],gb:['Google','#ea4335']};
function chip(k){return '<span class="chip" style="background:'+SRC[k][1]+'">'+SRC[k][0]+'</span>';}
var skeys=Object.keys(SRC);

var NAV=[['leads','📋 Лиды'],['deals','🤝 Сделки'],['inbox','💬 Чаты · Открытые линии'],['phone','📞 Телефония'],
['warehouse','📦 Товары · Склад'],['clients','👥 Клиенты'],['finance','💰 Финансы'],['analytics','📊 Аналитика'],
['roles','🛡️ Сотрудники и права'],['settings','⚙️ Настройки']];
var cur='leads';
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(function(n){
  return '<div class="nav-item'+(n[0]===cur?' active':'')+'" onclick="go(\''+n[0]+'\')"><span class="ic">'+n[1].split(' ')[0]+'</span><span>'+n[1].split(' ').slice(1).join(' ')+'</span></div>';}).join('');}
function go(id){cur=id;renderNav();document.getElementById('pageTitle').textContent=NAV.filter(function(n){return n[0]===id})[0][1].split(' ').slice(1).join(' ');VIEWS[id]();}
function set(html){document.getElementById('view').innerHTML=html;}

var names=['Sergeevna Vladlena','Гість Клиент','Kakashvili Levan','Гродзевич Христя','Родич Світлана','Катя Кравчук','Андрій Бойко','Кошова Анна','Nastya Litvinova','Мерлич Ирина','Артур Сидір','Оксана Дяк'];
var ops=['Ковальчук Илона','Оксаненко Кирилл','Крижевски Олег'];
var leadCols=[['Лід отриманий','#f5b301',40],['Взято в роботу','#f5b301',221],['Контакт встановлений','#a3d039',326],['Кваліфікований','#a3d039',5],['Підбір рішення','#a3d039',52],['Не вдалося','#ef4444',93]];

function leadCard(i){var src=skeys[i%skeys.length];var unseen=i%3===0;var nm=names[i%names.length];var op=ops[i%3];
 return '<div class="card" onclick="openDeal()"><div class="ttl">'+nm+' — Покриття для стін</div><div class="price">0 грн.</div>'+
 '<div style="margin-bottom:6px">'+chip(src)+'</div><div class="owner">'+av(op)+'<span>'+op+'</span></div>'+
 (unseen?'<div style="margin-top:6px"><span class="chip chip-unseen">НЕПЕРЕГЛЯНУТІ</span></div>':'')+
 '<div class="cardfoot">📞 ✉️ 💬<span class="t">сьогодні</span></div></div>';}

var VIEWS={};
VIEWS.leads=function(){set('<div class="kanban fade"><div class="toolbar">'+
 '<button class="btn btn-primary">+ Создать</button><select><option>Канбан</option><option>Список</option></select>'+
 '<input placeholder="Фильтр + поиск"/><div class="spacer"></div><span class="muted">28 Вхідні · 99+ Додатково</span></div>'+
 '<div class="board"><div class="cols">'+leadCols.map(function(c,ci){
   var cards='';for(var i=0;i<5+ci%3;i++)cards+=leadCard(i+ci);
   return '<div class="col"><div class="col-head" style="--c:'+c[1]+'"><b>'+c[0]+'</b><span class="muted">'+c[2]+'</span></div>'+
   '<div class="col-body"><div class="sum">0 грн.</div>'+cards+'</div></div>';}).join('')+'</div></div></div>');};

var funnels={'21':{name:'21 · Основний продукт',st:[['Дані для розрахунку','#3b82f6'],['Розрахунок','#6366f1'],['Домовились про оплату','#8b5cf6'],['Оплата отримана','#f59e0b'],['Заброньовано','#f59e0b'],['Відвантаження','#10b981'],['НП_ТТН','#10b981'],['Отримано','#059669'],['Завершити','#16a34a']]},
'22':{name:'22 · Тестовий набір',st:[['Нова заявка','#3b82f6'],['Узгодження','#6366f1'],['Відправлено','#f59e0b'],['Завершено','#16a34a']]}};
var cf='21';
VIEWS.deals=function(){var f=funnels[cf];
 set('<div class="kanban fade"><div class="toolbar"><button class="btn btn-primary">+ Сделка</button>'+
 '<select onchange="cf=this.value;VIEWS.deals()">'+Object.keys(funnels).map(function(k){return '<option value="'+k+'"'+(k===cf?' selected':'')+'>'+funnels[k].name+'</option>';}).join('')+'</select>'+
 '<div class="spacer"></div><span class="muted">Воронки ограничены правами · видно 2 из 5</span></div>'+
 '<div class="board"><div class="cols">'+f.st.map(function(s,si){
   var cards='';for(var i=0;i<2+si%3;i++){cards+='<div class="card" onclick="openDeal()"><div class="ttl">Угода #'+(52000+si*7+i)+'</div><div class="price">'+((2000+((si+i)*977)%9000)).toLocaleString()+' грн.</div>'+chip(skeys[(si+i)%skeys.length])+'<div class="owner">'+av(ops[i%3])+'<span>'+ops[i%3]+'</span></div></div>';}
   return '<div class="col" style="width:232px;flex:0 0 232px"><div class="stage" style="background:'+s[1]+'">'+s[0]+'</div>'+
   '<div class="col-body" style="background:transparent">'+cards+'</div></div>';}).join('')+'</div></div></div>');};

function openDeal(){var f=funnels['21'];
 set('<div class="scroll fade"><div class="dealhead"><button class="back" onclick="go(\'deals\')">←</button>'+
 '<b style="font-size:16px">Угода #52059</b><span class="muted">21 · Основний продукт</span><div class="spacer"></div><button class="btn btn-primary">Пропозиція ▾</button></div>'+
 '<div class="stagebar">'+f.st.map(function(s,i){return '<div class="stage" style="background:'+(i<4?'var(--brand)':'#cbd5e1')+'">'+s[0]+'</div>';}).join('')+'</div>'+
 '<div class="tabs">'+['Загальне','Товари','AI помічник','Cashflow','Історія','Дзвінки','Документи'].map(function(t,i){return '<div class="tab'+(i===0?' active':'')+'">'+t+'</div>';}).join('')+'</div>'+
 '<div class="grid2"><div>'+
   '<div class="panel"><div class="label">Клієнт</div><div style="font-weight:600;font-size:14px">Турок Ірина</div><div style="color:#64748b;font-size:13px;margin:4px 0 10px">+380 67 743 8953</div>'+
   '<div style="display:flex;gap:8px"><button class="btn" style="flex:1;background:#ecfdf5;color:#047857">📞 Позвонить</button><button class="btn" style="flex:1;background:#eff6ff;color:#1d4ed8">💬 Чат</button></div></div>'+
   '<div class="panel"><div class="label">Відповідальний</div><div class="owner" style="font-size:13px">'+av('Оксаненко Кирилл')+'Оксаненко Кирилл</div></div>'+
   '<div class="panel"><div class="label">Сума та валюта</div><div style="font-size:22px;font-weight:700;margin-bottom:10px">0 <span style="font-size:14px;color:#94a3b8">грн.</span></div>'+
   '<button class="btn btn-primary" style="width:100%;height:36px">Прийняти оплату</button>'+
   '<div style="margin-top:12px"><div class="row"><span class="muted">Аванс</span><span>—</span></div><div class="row"><span class="muted">Борг</span><span>0.00 грн.</span></div><div class="row"><span class="muted">Джерело</span><span style="color:#db2777">Instagram Direct</span></div></div></div>'+
 '</div><div>'+
