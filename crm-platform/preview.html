<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GMIdeas CRM — интерактивное превью</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --brand:#2a6df4;
    --brand-dark:#1f5fd6;
    --sidebar:#15324f;
    --sidebar-2:#1d4063;
  }
  *{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;}
  body{margin:0;overflow:hidden;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .kanban-scroll{scrollbar-width:thin;}
  .col-head{border-top:3px solid var(--c);}
  .chip{font-size:11px;line-height:1;padding:4px 7px;border-radius:5px;font-weight:600;}
  .ico-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#9aa7b8;}
  .ico-btn:hover{background:#eef2f7;color:var(--brand);}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;color:#c5d4e6;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;}
  .nav-item:hover{background:var(--sidebar-2);color:#fff;}
  .nav-item.active{background:var(--sidebar-2);color:#fff;border-left-color:#56b0ff;}
  .card{background:#fff;border:1px solid #e4e9f0;border-radius:8px;box-shadow:0 1px 2px rgba(20,40,80,.04);}
  .card:hover{box-shadow:0 4px 14px rgba(20,40,80,.12);border-color:#cdd9ea;}
  .stage{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);}
  .stage:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);}
  .fade{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .tab.active{color:var(--brand);border-bottom:2px solid var(--brand);}
  .toggle{width:34px;height:18px;border-radius:99px;background:#cbd5e1;position:relative;transition:.2s;cursor:pointer;}
  .toggle.on{background:var(--brand);}
  .toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;}
  .toggle.on::after{left:18px;}
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<div class="flex h-screen w-screen">

  <!-- ============ SIDEBAR ============ -->
  <aside class="w-[210px] shrink-0 flex flex-col" style="background:var(--sidebar)">
    <div class="h-[52px] flex items-center gap-2 px-4 border-b border-white/10">
      <div class="w-7 h-7 rounded-md bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-white font-bold text-sm">G</div>
      <span class="text-white font-semibold text-[15px]">GMIdeas <span class="text-sky-300">CRM</span></span>
    </div>
    <nav id="nav" class="flex-1 overflow-y-auto py-2"></nav>
    <div class="p-3 border-t border-white/10 flex items-center gap-2">
      <img src="https://i.pravatar.cc/60?img=12" class="w-7 h-7 rounded-full"/>
      <div class="text-[12px] leading-tight">
        <div class="text-white">Кирилл О.</div>
        <div class="text-sky-300/70">Администратор</div>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="flex-1 flex flex-col min-w-0" id="mainwrap">
    <!-- top bar -->
    <header class="h-[52px] bg-white border-b border-slate-200 flex items-center px-4 gap-3 shrink-0 z-10">
      <h1 id="pageTitle" class="text-[17px] font-semibold">Лиды</h1>
      <div class="flex-1"></div>
      <div class="relative">
        <input placeholder="Поиск по CRM…" class="w-64 h-8 bg-slate-100 rounded-md pl-8 pr-3 text-[13px] outline-none focus:ring-2 ring-blue-200"/>
        <svg class="w-4 h-4 absolute left-2.5 top-2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <button onclick="toggleTheme()" class="h-8 px-3 rounded-md bg-slate-100 hover:bg-slate-200 text-[13px] flex items-center gap-1.5">🎨 Тема</button>
      <div class="h-8 px-3 rounded-md bg-emerald-500 text-white text-[13px] flex items-center font-medium">15:10</div>
    </header>

    <!-- theme bar -->
    <div id="themeBar" class="hidden bg-white border-b border-slate-200 px-4 py-2 flex items-center gap-2 text-[12px] flex-wrap">
      <span class="text-slate-500">Фон рабочего стола:</span>
      <button onclick="setBg('#eef2f7')" class="w-7 h-7 rounded border" style="background:#eef2f7"></button>
      <button onclick="setBg('linear-gradient(135deg,#e0f2fe,#ede9fe)')" class="w-7 h-7 rounded border" style="background:linear-gradient(135deg,#e0f2fe,#ede9fe)"></button>
      <button onclick="setBg('linear-gradient(135deg,#1e3a8a,#0ea5e9)')" class="w-7 h-7 rounded border" style="background:linear-gradient(135deg,#1e3a8a,#0ea5e9)"></button>
      <button onclick="setBg(beach)" class="w-7 h-7 rounded border bg-cover" style="background-image:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=80')"></button>
      <span class="text-slate-400 ml-3">Акцент:</span>
      <button onclick="setAccent('#2a6df4')" class="w-5 h-5 rounded-full" style="background:#2a6df4"></button>
      <button onclick="setAccent('#7c3aed')" class="w-5 h-5 rounded-full" style="background:#7c3aed"></button>
      <button onclick="setAccent('#0ea5e9')" class="w-5 h-5 rounded-full" style="background:#0ea5e9"></button>
      <button onclick="setAccent('#059669')" class="w-5 h-5 rounded-full" style="background:#059669"></button>
      <span class="text-slate-400 ml-2 italic">(каждый сотрудник настраивает под себя — сохраняется в его профиле)</span>
    </div>

    <!-- view content -->
    <main id="view" class="flex-1 overflow-hidden"></main>
  </div>
</div>

<script>
const beach="linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.05)),url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600')";
let curView='leads';

/* ---------- THEME ---------- */
function toggleTheme(){document.getElementById('themeBar').classList.toggle('hidden');}
function setBg(v){document.getElementById('view').style.background=v;document.getElementById('view').style.backgroundSize='cover';}
function setAccent(c){document.documentElement.style.setProperty('--brand',c);}

/* ---------- NAV ---------- */
const NAV=[
  ['leads','Лиды','M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z'],
  ['deals','Сделки','M3 7h18M3 12h18M3 17h18'],
  ['inbox','Чаты · Открытые линии','M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z'],
  ['phone','Телефония','M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13 1 .37 1.95.7 2.87a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.21-1.21a2 2 0 012.11-.45c.92.33 1.87.57 2.87.7A2 2 0 0122 16.92z'],
  ['warehouse','Товары · Склад','M3 9l9-6 9 6v11a1 1 0 01-1 1H4a1 1 0 01-1-1z'],
  ['clients','Клиенты','M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 7a4 4 0 100 8 4 4 0 000-8z'],
  ['finance','Финансы','M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6'],
  ['analytics','Аналитика','M3 3v18h18M7 14l4-4 3 3 5-6'],
  ['roles','Сотрудники и права','M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z'],
  ['settings','Настройки','M12 15a3 3 0 100-6 3 3 0 000 6z'],
];
function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(([id,label,d])=>
   `<div class="nav-item ${id===curView?'active':''}" onclick="go('${id}')">
      <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="${d}"/></svg>
      <span>${label}</span></div>`).join('');
}
function go(id){curView=id;renderNav();document.getElementById('pageTitle').textContent=NAV.find(n=>n[0]===id)[1];VIEWS[id]();}

/* ---------- SAMPLE DATA ---------- */
const SRC={tg:['Telegram','#27a7e7'],vb:['Viber','#7d4fc4'],ig:['Instagram','#e1306c'],fb:['Facebook','#1877f2'],wa:['WhatsApp','#25d366'],call:['Звонок','#16a34a'],gb:['Google Бизнес','#ea4335']};
function srcBadge(k){const[t,c]=SRC[k];return `<span class="chip text-white" style="background:${c}">${t}</span>`;}

const leadCols=[
  ['Лід отриманий','#f5b301',40],['Взято в роботу','#f5b301',221],['Контакт встановлений','#a3d039',326],
  ['Кваліфікований','#a3d039',5],['Підбір рішення','#a3d039',52],['Не вдалося зв.','#ef4444',93]
];
const names=['Sergeevna Vladlena','Гість','Kakashvili Levan','Гродзевич Христя','Родич Світлана','Катя','Андрій','Кошова Анна','Nastya Litvinova','Мерлич Ирина','Артур','Оксана'];
const ops=['Ковальчук Илона','Оксаненко Кирилл','Крижевски Олег'];
const skeys=Object.keys(SRC);
function leadCard(i){
  const src=skeys[i%skeys.length];
  const unseen=i%3===0;
  return `<div class="card p-2.5 mb-2 fade cursor-pointer" onclick="openDeal()">
    <div class="text-[13px] font-semibold text-slate-800 leading-snug mb-1">${names[i%names.length]} — Покриття для стін</div>
    <div class="text-[12px] text-slate-500 mb-1">0 грн.</div>
    <div class="mb-1.5">${srcBadge(src)}</div>
    <div class="flex items-center gap-1.5 mb-1.5">
      <img src="https://i.pravatar.cc/40?img=${20+i%30}" class="w-4 h-4 rounded-full"/>
      <span class="text-[11.5px] text-slate-600">${ops[i%3]}</span>
    </div>
    ${unseen?`<span class="chip" style="background:#fff3cd;color:#9a7d0a">НЕПЕРЕГЛЯНУТІ</span>`:''}
    <div class="flex items-center gap-0.5 mt-1.5 pt-1.5 border-t border-slate-100">
      <div class="ico-btn">📞</div><div class="ico-btn">✉️</div><div class="ico-btn">💬</div>
      <span class="ml-auto text-[10.5px] text-slate-400">сьогодні</span>
    </div>
  </div>`;
}

  '22':{name:'22 · Тестовий набір',stages:[['Нова заявка','#3b82f6'],['Узгодження','#6366f1'],['Відправлено','#f59e0b'],['Завершено','#16a34a']]}

      </div>
    </div>
  </div>`;
};
